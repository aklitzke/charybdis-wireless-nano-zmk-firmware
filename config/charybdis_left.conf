CONFIG_ZMK_USB=n # ZMK_USB is only allowed when: not split or, split and role is central (i.e., not left)

# Peripheral does not re-establish the split link after deep sleep without a
# power cycle. This file is merged last for the left half, so it overrides the
# CONFIG_ZMK_SLEEP=y set in config/charybdis.conf.
CONFIG_ZMK_SLEEP=n
