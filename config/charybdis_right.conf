## PMW3610 input device
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

## --- generic logging ---
# CONFIG_LOG=y
# CONFIG_LOG_DEFAULT_LEVEL=3
# CONFIG_LOG_MODE_DEFERRED=n
# CONFIG_LOG_BACKEND_UART=y
# CONFIG_USB_CDC_ACM=y
# CONFIG_LOG_MODE_DEFERRED=n

## --- trackball responsiveness over BLE ---
## These only apply to the right half, which is the one that holds the
## trackball and is the peripheral on the host link. Leaving the left half
## alone keeps its battery life untouched.
##
## ZMK defaults to BT_PERIPHERAL_PREF_LATENCY=30, letting the keyboard skip up
## to 30 connection events. Fine for sporadic keystrokes, but it is what makes
## continuous pointer motion feel laggy over BLE while USB stays instant.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

## Ask for a fixed 7.5ms interval instead of allowing up to 15ms.
## The host has the final say; these are preferences.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6

## ZMK_BLE_EXPERIMENTAL_CONN sets BT_CTLR_PHY_2M=n by default. 2M PHY halves
## packet air time, so more reports fit in each connection event.
CONFIG_BT_CTLR_PHY_2M=y
