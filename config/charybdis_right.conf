## PMW3610 input device
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

## Without this the host counts wheel EVENTS and ignores their magnitude, so
## zip_scroll_scaler has no perceptible effect no matter how small the divisor.
## HID Resolution Multipliers make the scaled values actually mean something.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

## Pointer lag was a queue backlog, not the radio. ZMK buffers mouse HID
## reports in a message queue sized by this option, default 20. The sensor
## outruns the BLE link, the queue fills, and from then on the pointer is
## persistently 20 reports behind - roughly the quarter second observed. The
## producer even blocks up to 100ms per report once full (see hog.c). It only
## recovers when motion stops and the queue drains, which matches the lag
## clearing when the mouse layer times out or the link reconnects.
##
## A short queue bounds the worst-case backlog instead. Excess reports are
## discarded rather than buffered, which is the right trade for pointer
## motion: current position matters, a backlog of stale ones does not.
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=3

